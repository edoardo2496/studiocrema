<!DOCTYPE html>
<html lang="{{ site.lang | default: 'it' }}">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>
    {% if page.title and page.title != "Home" %}
      {{ page.title }} | {{ site.title }}
    {% else %}
      {{ site.title }} — Consulenza gestionale
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <meta name="theme-color" content="#172b2a">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="icon" type="image/svg+xml" href="{{ '/assets/favicon.svg' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>

<body>

  {% include nav.html %}

  <main>
    {{ content }}
  </main>

  {% include footer.html %}

</body>

</html>
